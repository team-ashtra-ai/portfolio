<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">Studio hero visual</title>
<desc id="desc">Creative themed editorial gallery artwork with no visible text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".48" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#d4d4d4"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e30613"/>
    <stop offset="1" stop-color="#8d256d"/>
  </linearGradient>
  <pattern id="grain" width="46" height="46" patternUnits="userSpaceOnUse">
    <path d="M0 23 H46" stroke="#111111" stroke-width="1" opacity=".06"/>
    <path d="M23 0 V46" stroke="#111111" stroke-width="1" opacity=".045"/>
  </pattern>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="13" stdDeviation="14" flood-color="#0b0b0b" flood-opacity=".22"/>
  </filter>
  <clipPath id="frame">
    <rect x="16" y="14" width="928" height="612" rx="53"/>
  </clipPath>
</defs>
<rect width="960" height="640" fill="url(#bg)"/>
<rect width="960" height="640" fill="url(#grain)"/>
<g clip-path="url(#frame)">
  <path d="M-115 115 L557 -77 L1094 243 L307 589 Z" fill="url(#accent)" opacity=".18"/>
  <path d="M691 -51 C518 128,806 269,586 461 C749 550,1037 486,1133 282 L1133 -51 Z" fill="#ffffff" opacity=".36"/>

  <path d="M-59 486 C 172 332, 355 588, 556 396 S 844 217, 1040 345" fill="none" stroke="#e30613" stroke-width="26" opacity=".38"/>
  <path d="M76 115 C 268 25, 403 115, 556 51 S 844 12, 921 140" fill="none" stroke="#111111" stroke-width="13" opacity=".16"/>

  <g filter="url(#softShadow)" transform="translate(96 83) rotate(-2)">
    <rect width="288" height="332" rx="12" fill="#ffffff" opacity=".92"/>
    <rect x="38" y="32" width="211" height="140" rx="8" fill="#e8333d"/>
    <rect x="38" y="198" width="211" height="89" rx="8" fill="#bcbcbc"/>
  </g>
  <g filter="url(#softShadow)" transform="translate(432 128) rotate(4)">
    <rect width="364" height="268" rx="16" fill="#ffffff" opacity=".88"/>
    <path d="M38 192 C 115 96, 230 243, 326 115" fill="none" stroke="#e30613" stroke-width="12" stroke-linecap="round"/>
  </g>

  <path d="M58 563 C230 499,365 614,538 538 S845 461,941 550" fill="none" stroke="#111111" stroke-width="6" opacity=".12"/>
</g>
</svg>
