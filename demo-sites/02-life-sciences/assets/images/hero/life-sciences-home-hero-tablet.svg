  <path d="M76 136 C 268 30, 403 136, 556 60 S 844 15, 921 167" fill="none" stroke="#5cffb1" stroke-width="13" opacity=".16"/>

  <g filter="url(#softShadow)" transform="translate(115 136) rotate(-3)">
    <rect width="518" height="395" rx="28" fill="#4bd191" opacity=".94"/>
    <rect x="38" y="45" width="192" height="106" rx="18" fill="#598aff" opacity=".86"/>
    <rect x="268" y="45" width="172" height="106" rx="18" fill="#ffffff" opacity=".15"/>
    <path d="M48 243 L153 182 L259 288 L403 144 L470 220" fill="none" stroke="#2f6dff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
