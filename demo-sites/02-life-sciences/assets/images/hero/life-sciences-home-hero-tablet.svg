<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
<title id="title">Helix hero visual</title>
<desc id="desc">Life Sciences themed precision interface artwork with no visible text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8e8f90"/>
    <stop offset=".48" stop-color="#050709"/>
    <stop offset="1" stop-color="#153427"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2f6dff"/>
    <stop offset="1" stop-color="#58a4ee"/>
  </linearGradient>
  <pattern id="grain" width="46" height="46" patternUnits="userSpaceOnUse">
    <path d="M0 23 H46" stroke="#5cffb1" stroke-width="1" opacity=".06"/>
    <path d="M23 0 V46" stroke="#5cffb1" stroke-width="1" opacity=".045"/>
  </pattern>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
