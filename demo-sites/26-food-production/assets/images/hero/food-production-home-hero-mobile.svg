<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc">
<title id="title">Grain hero visual</title>
<desc id="desc">Food Production themed product theatre artwork with no visible text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#faf6eb"/>
    <stop offset=".48" stop-color="#f5ead2"/>
    <stop offset="1" stop-color="#c9cdc6"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f26b3a"/>
    <stop offset="1" stop-color="#f7973b"/>
  </linearGradient>
  <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M0 24 H48" stroke="#004b8d" stroke-width="1" opacity=".06"/>
    <path d="M24 0 V48" stroke="#004b8d" stroke-width="1" opacity=".045"/>
  </pattern>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="24" stdDeviation="14" flood-color="#00315c" flood-opacity=".22"/>
  </filter>
  <clipPath id="frame">
    <rect x="15" y="18" width="870" height="1083" rx="75"/>
  </clipPath>
</defs>
<rect width="900" height="1120" fill="url(#bg)"/>
<rect width="900" height="1120" fill="url(#grain)"/>
<g clip-path="url(#frame)">
  <path d="M-108 202 L522 -134 L1026 426 L288 1030 Z" fill="url(#accent)" opacity=".18"/>
  <path d="M648 -90 C486 224,756 470,549 806 C702 963,972 851,1062 493 L1062 -90 Z" fill="#ffffff" opacity=".36"/>

  <path d="M-66 851 C 162 582, 333 1030, 522 694 S 792 380, 980 604" fill="none" stroke="#f26b3a" stroke-width="25" opacity=".38"/>
  <path d="M72 201 C 252 44, 378 201, 522 89 S 792 22, 864 246" fill="none" stroke="#004b8d" stroke-width="12" opacity=".16"/>

  <g filter="url(#softShadow)" transform="translate(108 246)">
    <rect width="630" height="448" rx="34" fill="#ffffff" opacity=".9"/>
    <rect x="54" y="89" width="144" height="268" rx="24" fill="#f47d52"/>
    <rect x="243" y="44" width="162" height="336" rx="28" fill="#b8cddf"/>
    <rect x="459" y="100" width="117" height="246" rx="22" fill="#ffdf3d"/>
    <path d="M36 380 H594" stroke="#004b8d" stroke-width="8" opacity=".22" stroke-linecap="round"/>
  </g>

  <path d="M54 986 C216 874,342 1075,504 941 S792 806,882 963" fill="none" stroke="#004b8d" stroke-width="6" opacity=".12"/>
</g>
</svg>
