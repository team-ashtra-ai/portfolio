<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">Grain hero visual</title>
<desc id="desc">Food Production themed product theatre artwork with no visible text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#faf6eb"/>
    <stop offset=".48" stop-color="#f5ead2"/>
    <stop offset="1" stop-color="#c9cdc6"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f26b3a"/>
    <stop offset="1" stop-color="#f7973b"/>
  </linearGradient>
  <pattern id="grain" width="46" height="46" patternUnits="userSpaceOnUse">
    <path d="M0 23 H46" stroke="#004b8d" stroke-width="1" opacity=".06"/>
    <path d="M23 0 V46" stroke="#004b8d" stroke-width="1" opacity=".045"/>
  </pattern>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="13" stdDeviation="14" flood-color="#00315c" flood-opacity=".22"/>
  </filter>
  <clipPath id="frame">
    <rect x="16" y="14" width="928" height="612" rx="53"/>
  </clipPath>
</defs>
<rect width="960" height="640" fill="url(#bg)"/>
<rect width="960" height="640" fill="url(#grain)"/>
<g clip-path="url(#frame)">
  <path d="M-115 115 L557 -77 L1094 243 L307 589 Z" fill="url(#accent)" opacity=".18"/>
  <path d="M691 -51 C518 128,806 269,586 461 C749 550,1037 486,1133 282 L1133 -51 Z" fill="#ffffff" opacity=".36"/>

  <path d="M-38 486 C 172 332, 355 588, 556 396 S 844 217, 1040 345" fill="none" stroke="#f26b3a" stroke-width="26" opacity=".38"/>
  <path d="M76 115 C 268 25, 403 115, 556 51 S 844 12, 921 140" fill="none" stroke="#004b8d" stroke-width="13" opacity=".16"/>

  <g filter="url(#softShadow)" transform="translate(115 140)">
    <rect width="672" height="256" rx="34" fill="#ffffff" opacity=".9"/>
    <rect x="57" y="51" width="153" height="153" rx="24" fill="#f47d52"/>
    <rect x="259" y="25" width="172" height="192" rx="28" fill="#b8cddf"/>
    <rect x="489" y="57" width="124" height="140" rx="22" fill="#ffdf3d"/>
    <path d="M38 217 H633" stroke="#004b8d" stroke-width="8" opacity=".22" stroke-linecap="round"/>
  </g>

  <path d="M58 563 C230 499,365 614,538 538 S845 461,941 550" fill="none" stroke="#004b8d" stroke-width="6" opacity=".12"/>
</g>
</svg>
