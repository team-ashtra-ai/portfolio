<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
<title id="title">Stay hero visual</title>
<desc id="desc">Hospitality themed arrival atmosphere artwork with no visible text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#faf8f4"/>
    <stop offset=".48" stop-color="#f3efe7"/>
    <stop offset="1" stop-color="#d0ccc4"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#b89b72"/>
    <stop offset="1" stop-color="#9b8d6f"/>
  </linearGradient>
  <pattern id="grain" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M0 20 H40" stroke="#2f2a24" stroke-width="1" opacity=".06"/>
    <path d="M20 0 V40" stroke="#2f2a24" stroke-width="1" opacity=".045"/>
  </pattern>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#1f1b17" flood-opacity=".22"/>
  </filter>
  <clipPath id="frame">
    <rect x="16" y="14" width="928" height="732" rx="63"/>
  </clipPath>
</defs>
<rect width="960" height="760" fill="url(#bg)"/>
<rect width="960" height="760" fill="url(#grain)"/>
<g clip-path="url(#frame)">
  <path d="M-115 137 L557 -91 L1094 289 L307 699 Z" fill="url(#accent)" opacity=".18"/>
  <path d="M691 -61 C518 152,806 319,586 547 C749 654,1037 578,1133 334 L1133 -61 Z" fill="#ffffff" opacity=".36"/>

  <path d="M-45 577 C 172 395, 355 699, 556 471 S 844 258, 1040 410" fill="none" stroke="#b89b72" stroke-width="26" opacity=".38"/>
  <path d="M76 136 C 268 30, 403 136, 556 60 S 844 15, 921 167" fill="none" stroke="#2f2a24" stroke-width="13" opacity=".16"/>

  <g filter="url(#softShadow)" transform="translate(115 98)">
    <rect width="595" height="425" rx="42" fill="#ffffff" opacity=".88"/>
    <path d="M76 60 H518 V258 H76 Z" fill="#c9b394" opacity=".62"/>
    <path d="M134 326 C 240 258, 364 395, 480 304" fill="none" stroke="#2f2a24" stroke-width="12" opacity=".2" stroke-linecap="round"/>
    <rect x="163" y="288" width="230" height="68" rx="22" fill="#6c756b" opacity=".78"/>
  </g>

  <path d="M58 669 C230 593,365 730,538 638 S845 547,941 654" fill="none" stroke="#2f2a24" stroke-width="6" opacity=".12"/>
</g>
