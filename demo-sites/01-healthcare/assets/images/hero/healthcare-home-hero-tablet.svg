<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
<title id="title">Aster hero visual</title>
<desc id="desc">Healthcare themed clinical calm artwork with no visible text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fbfdff"/>
    <stop offset=".48" stop-color="#f7fbff"/>
    <stop offset="1" stop-color="#cdd2d7"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#20b8d8"/>
    <stop offset="1" stop-color="#66d0e7"/>
  </linearGradient>
  <pattern id="grain" width="41" height="41" patternUnits="userSpaceOnUse">
    <path d="M0 20 H41" stroke="#101820" stroke-width="1" opacity=".06"/>
    <path d="M20 0 V41" stroke="#101820" stroke-width="1" opacity=".045"/>
  </pattern>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0a1015" flood-opacity=".22"/>
  </filter>
  <clipPath id="frame">
    <rect x="16" y="14" width="928" height="732" rx="63"/>
  </clipPath>
</defs>
<rect width="960" height="760" fill="url(#bg)"/>
<rect width="960" height="760" fill="url(#grain)"/>
<g clip-path="url(#frame)">
  <path d="M-115 137 L557 -91 L1094 289 L307 699 Z" fill="url(#accent)" opacity=".18"/>
  <path d="M691 -61 C518 152,806 319,586 547 C749 654,1037 578,1133 334 L1133 -61 Z" fill="#ffffff" opacity=".36"/>

  <path d="M-45 577 C 172 395, 355 699, 556 471 S 844 258, 1040 410" fill="none" stroke="#20b8d8" stroke-width="26" opacity=".38"/>
  <path d="M76 136 C 268 30, 403 136, 556 60 S 844 15, 921 167" fill="none" stroke="#101820" stroke-width="13" opacity=".16"/>

  <g filter="url(#softShadow)" transform="translate(115 106)">
    <rect width="345" height="440" rx="38" fill="#ffffff" opacity=".92"/>
    <path d="M57 326 C 124 167, 240 167, 297 326" fill="none" stroke="#20b8d8" stroke-width="20" stroke-linecap="round"/>
    <circle cx="172" cy="174" r="57" fill="#58cae2" opacity=".76"/>
  </g>
  <g transform="translate(537 136) rotate(4)" filter="url(#softShadow)">
