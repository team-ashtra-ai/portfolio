    <path d="M38 258 C 105 174, 182 319, 240 228" fill="none" stroke="#101820" stroke-width="10" opacity=".25" stroke-linecap="round"/>
  </g>

  <path d="M58 669 C230 593,365 730,538 638 S845 547,941 654" fill="none" stroke="#101820" stroke-width="6" opacity=".12"/>
