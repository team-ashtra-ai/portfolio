<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc">
<title id="title">Pulse hero visual</title>
<desc id="desc">Sports themed executive decision artwork with no visible text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".48" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#d4d4d4"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff3d00"/>
    <stop offset="1" stop-color="#ea724c"/>
  </linearGradient>
  <pattern id="grain" width="38" height="38" patternUnits="userSpaceOnUse">
    <path d="M0 19 H38" stroke="#111111" stroke-width="1" opacity=".06"/>
    <path d="M19 0 V38" stroke="#111111" stroke-width="1" opacity=".045"/>
  </pattern>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="24" stdDeviation="14" flood-color="#0b0b0b" flood-opacity=".22"/>
  </filter>
  <clipPath id="frame">
    <rect x="15" y="18" width="870" height="1083" rx="75"/>
  </clipPath>
</defs>
<rect width="900" height="1120" fill="url(#bg)"/>
<rect width="900" height="1120" fill="url(#grain)"/>
<g clip-path="url(#frame)">
  <path d="M-108 202 L522 -134 L1026 426 L288 1030 Z" fill="url(#accent)" opacity=".18"/>
  <path d="M648 -90 C486 224,756 470,549 806 C702 963,972 851,1062 493 L1062 -90 Z" fill="#ffffff" opacity=".36"/>

  <path d="M-66 851 C 162 582, 333 1030, 522 694 S 792 380, 980 604" fill="none" stroke="#ff3d00" stroke-width="25" opacity=".38"/>
  <path d="M72 201 C 252 44, 378 201, 522 89 S 792 22, 864 246" fill="none" stroke="#111111" stroke-width="12" opacity=".16"/>

  <g filter="url(#softShadow)" transform="translate(99 190)">
    <rect width="594" height="537" rx="30" fill="#ffffff" opacity=".9"/>
    <path d="M54 380 L162 212 L288 313 L432 145 L531 268" fill="none" stroke="#ff3d00" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="54" y="448" width="162" height="44" rx="8" fill="#111111" opacity=".18"/>
    <rect x="270" y="448" width="216" height="44" rx="8" fill="#111111" opacity=".12"/>
  </g>

  <path d="M54 986 C216 874,342 1075,504 941 S792 806,882 963" fill="none" stroke="#111111" stroke-width="6" opacity=".12"/>
</g>
</svg>
