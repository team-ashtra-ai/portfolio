<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
<title id="title">Corner hero visual</title>
<desc id="desc">Retail themed product theatre artwork with no visible text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fafafb"/>
    <stop offset=".48" stop-color="#f5f5f7"/>
    <stop offset="1" stop-color="#ceced0"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0071e3"/>
    <stop offset="1" stop-color="#3d83cc"/>
  </linearGradient>
  <pattern id="grain" width="41" height="41" patternUnits="userSpaceOnUse">
    <path d="M0 20 H41" stroke="#1d1d1f" stroke-width="1" opacity=".06"/>
    <path d="M20 0 V41" stroke="#1d1d1f" stroke-width="1" opacity=".045"/>
  </pattern>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#131314" flood-opacity=".22"/>
  </filter>
  <clipPath id="frame">
    <rect x="16" y="14" width="928" height="732" rx="63"/>
  </clipPath>
</defs>
<rect width="960" height="760" fill="url(#bg)"/>
<rect width="960" height="760" fill="url(#grain)"/>
<g clip-path="url(#frame)">
  <path d="M-115 137 L557 -91 L1094 289 L307 699 Z" fill="url(#accent)" opacity=".18"/>
  <path d="M691 -61 C518 152,806 319,586 547 C749 654,1037 578,1133 334 L1133 -61 Z" fill="#ffffff" opacity=".36"/>

  <path d="M-52 577 C 172 395, 355 699, 556 471 S 844 258, 1040 410" fill="none" stroke="#0071e3" stroke-width="26" opacity=".38"/>
  <path d="M76 136 C 268 30, 403 136, 556 60 S 844 15, 921 167" fill="none" stroke="#1d1d1f" stroke-width="13" opacity=".16"/>

  <g filter="url(#softShadow)" transform="translate(115 167)">
    <rect width="672" height="304" rx="34" fill="#ffffff" opacity=".9"/>
    <rect x="57" y="60" width="153" height="182" rx="24" fill="#1f82e6"/>
    <rect x="259" y="30" width="172" height="228" rx="28" fill="#c0c0c0"/>
    <rect x="489" y="68" width="124" height="167" rx="22" fill="#a1a1a6"/>
    <path d="M38 258 H633" stroke="#1d1d1f" stroke-width="8" opacity=".22" stroke-linecap="round"/>
  </g>

  <path d="M58 669 C230 593,365 730,538 638 S845 547,941 654" fill="none" stroke="#1d1d1f" stroke-width="6" opacity=".12"/>
</g>
