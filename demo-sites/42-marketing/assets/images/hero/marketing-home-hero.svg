<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">Spark hero visual</title>
<desc id="desc">Marketing themed executive decision artwork with no visible text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8e8e8e"/>
    <stop offset=".48" stop-color="#050505"/>
    <stop offset="1" stop-color="#323232"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6bdcff"/>
    <stop offset="1" stop-color="#7de9c8"/>
  </linearGradient>
  <pattern id="grain" width="43" height="43" patternUnits="userSpaceOnUse">
    <path d="M0 21 H43" stroke="#ffffff" stroke-width="1" opacity=".06"/>
    <path d="M21 0 V43" stroke="#ffffff" stroke-width="1" opacity=".045"/>
  </pattern>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="13" stdDeviation="14" flood-color="#a6a6a6" flood-opacity=".22"/>
  </filter>
  <clipPath id="frame">
    <rect x="16" y="14" width="928" height="612" rx="53"/>
  </clipPath>
</defs>
<rect width="960" height="640" fill="url(#bg)"/>
<rect width="960" height="640" fill="url(#grain)"/>
<g clip-path="url(#frame)">
  <path d="M-115 115 L557 -77 L1094 243 L307 589 Z" fill="url(#accent)" opacity=".18"/>
  <path d="M691 -51 C518 128,806 269,586 461 C749 550,1037 486,1133 282 L1133 -51 Z" fill="#ffffff" opacity=".36"/>

  <path d="M-80 486 C 172 332, 355 588, 556 396 S 844 217, 1040 345" fill="none" stroke="#6bdcff" stroke-width="26" opacity=".38"/>
  <path d="M76 115 C 268 25, 403 115, 556 51 S 844 12, 921 140" fill="none" stroke="#ffffff" stroke-width="13" opacity=".16"/>

  <g filter="url(#softShadow)" transform="translate(105 108)">
    <rect width="633" height="307" rx="30" fill="#ffffff" opacity=".9"/>
    <path d="M57 217 L172 121 L307 179 L460 83 L566 153" fill="none" stroke="#6bdcff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="57" y="256" width="172" height="25" rx="8" fill="#ffffff" opacity=".18"/>
    <rect x="288" y="256" width="230" height="25" rx="8" fill="#ffffff" opacity=".12"/>
  </g>

  <path d="M58 563 C230 499,365 614,538 538 S845 461,941 550" fill="none" stroke="#ffffff" stroke-width="6" opacity=".12"/>
</g>
</svg>
