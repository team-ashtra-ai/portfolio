<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
<title id="title">Spark hero visual</title>
<desc id="desc">Marketing themed executive decision artwork with no visible text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8e8e8e"/>
    <stop offset=".48" stop-color="#050505"/>
    <stop offset="1" stop-color="#323232"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6bdcff"/>
    <stop offset="1" stop-color="#7de9c8"/>
  </linearGradient>
  <pattern id="grain" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M0 21 H42" stroke="#ffffff" stroke-width="1" opacity=".06"/>
    <path d="M21 0 V42" stroke="#ffffff" stroke-width="1" opacity=".045"/>
  </pattern>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#a6a6a6" flood-opacity=".22"/>
  </filter>
  <clipPath id="frame">
    <rect x="16" y="14" width="928" height="732" rx="63"/>
  </clipPath>
</defs>
<rect width="960" height="760" fill="url(#bg)"/>
<rect width="960" height="760" fill="url(#grain)"/>
<g clip-path="url(#frame)">
  <path d="M-115 137 L557 -91 L1094 289 L307 699 Z" fill="url(#accent)" opacity=".18"/>
  <path d="M691 -61 C518 152,806 319,586 547 C749 654,1037 578,1133 334 L1133 -61 Z" fill="#ffffff" opacity=".36"/>

  <path d="M-59 577 C 172 395, 355 699, 556 471 S 844 258, 1040 410" fill="none" stroke="#6bdcff" stroke-width="26" opacity=".38"/>
  <path d="M76 136 C 268 30, 403 136, 556 60 S 844 15, 921 167" fill="none" stroke="#ffffff" stroke-width="13" opacity=".16"/>

  <g filter="url(#softShadow)" transform="translate(105 129)">
    <rect width="633" height="364" rx="30" fill="#ffffff" opacity=".9"/>
    <path d="M57 258 L172 144 L307 212 L460 98 L566 182" fill="none" stroke="#6bdcff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="57" y="304" width="172" height="30" rx="8" fill="#ffffff" opacity=".18"/>
    <rect x="288" y="304" width="230" height="30" rx="8" fill="#ffffff" opacity=".12"/>
  </g>

  <path d="M58 669 C230 593,365 730,538 638 S845 547,941 654" fill="none" stroke="#ffffff" stroke-width="6" opacity=".12"/>
</g>
</svg>
