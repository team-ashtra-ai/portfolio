<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">Paw hero visual</title>
<desc id="desc">Pets themed clinical calm artwork with no visible text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffbf8"/>
    <stop offset=".48" stop-color="#fff7ef"/>
    <stop offset="1" stop-color="#d8ded5"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffb199"/>
    <stop offset="1" stop-color="#ab8675"/>
  </linearGradient>
  <pattern id="grain" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M0 22 H44" stroke="#256a5e" stroke-width="1" opacity=".06"/>
    <path d="M22 0 V44" stroke="#256a5e" stroke-width="1" opacity=".045"/>
  </pattern>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="13" stdDeviation="14" flood-color="#18453d" flood-opacity=".22"/>
  </filter>
  <clipPath id="frame">
    <rect x="16" y="14" width="928" height="612" rx="53"/>
  </clipPath>
</defs>
<rect width="960" height="640" fill="url(#bg)"/>
<rect width="960" height="640" fill="url(#grain)"/>
<g clip-path="url(#frame)">
  <path d="M-115 115 L557 -77 L1094 243 L307 589 Z" fill="url(#accent)" opacity=".18"/>
  <path d="M691 -51 C518 128,806 269,586 461 C749 550,1037 486,1133 282 L1133 -51 Z" fill="#ffffff" opacity=".36"/>

  <path d="M-80 486 C 172 332, 355 588, 556 396 S 844 217, 1040 345" fill="none" stroke="#ffb199" stroke-width="26" opacity=".38"/>
  <path d="M76 115 C 268 25, 403 115, 556 51 S 844 12, 921 140" fill="none" stroke="#256a5e" stroke-width="13" opacity=".16"/>

  <g filter="url(#softShadow)" transform="translate(115 89)">
    <rect width="345" height="371" rx="38" fill="#ffffff" opacity=".92"/>
    <path d="M57 275 C 124 140, 240 140, 297 275" fill="none" stroke="#ffb199" stroke-width="20" stroke-linecap="round"/>
    <circle cx="172" cy="147" r="48" fill="#ffc4b2" opacity=".76"/>
  </g>
  <g transform="translate(537 115) rotate(4)" filter="url(#softShadow)">
    <rect width="268" height="307" rx="30" fill="#fff9f7"/>
    <path d="M38 217 C 105 147, 182 268, 240 192" fill="none" stroke="#256a5e" stroke-width="10" opacity=".25" stroke-linecap="round"/>
  </g>

  <path d="M58 563 C230 499,365 614,538 538 S845 461,941 550" fill="none" stroke="#256a5e" stroke-width="6" opacity=".12"/>
</g>
</svg>
