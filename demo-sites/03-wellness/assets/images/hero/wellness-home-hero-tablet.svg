<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
<title id="title">Luma hero visual</title>
<desc id="desc">Wellness themed clinical calm artwork with no visible text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffbef"/>
    <stop offset=".48" stop-color="#fff6dc"/>
    <stop offset="1" stop-color="#d6d3c5"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffcf2e"/>
    <stop offset="1" stop-color="#fcc11d"/>
  </linearGradient>
  <pattern id="grain" width="51" height="51" patternUnits="userSpaceOnUse">
