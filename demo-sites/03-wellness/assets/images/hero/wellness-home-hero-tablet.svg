    <path d="M57 326 C 124 167, 240 167, 297 326" fill="none" stroke="#ffcf2e" stroke-width="20" stroke-linecap="round"/>
    <circle cx="172" cy="174" r="57" fill="#ffdb62" opacity=".76"/>
