<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">Stage hero visual</title>
<desc id="desc">Entertainment themed cinematic command artwork with no visible text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8e8e8e"/>
    <stop offset=".48" stop-color="#050505"/>
    <stop offset="1" stop-color="#323232"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c69a55"/>
    <stop offset="1" stop-color="#d17c46"/>
  </linearGradient>
  <pattern id="grain" width="37" height="37" patternUnits="userSpaceOnUse">
    <path d="M0 18 H37" stroke="#ffffff" stroke-width="1" opacity=".06"/>
    <path d="M18 0 V37" stroke="#ffffff" stroke-width="1" opacity=".045"/>
  </pattern>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="13" stdDeviation="14" flood-color="#a6a6a6" flood-opacity=".22"/>
  </filter>
  <clipPath id="frame">
    <rect x="16" y="14" width="928" height="612" rx="53"/>
  </clipPath>
</defs>
<rect width="960" height="640" fill="url(#bg)"/>
<rect width="960" height="640" fill="url(#grain)"/>
<g clip-path="url(#frame)">
  <path d="M-115 115 L557 -77 L1094 243 L307 589 Z" fill="url(#accent)" opacity=".18"/>
  <path d="M691 -51 C518 128,806 269,586 461 C749 550,1037 486,1133 282 L1133 -51 Z" fill="#ffffff" opacity=".36"/>

  <path d="M-59 486 C 172 332, 355 588, 556 396 S 844 217, 1040 345" fill="none" stroke="#c69a55" stroke-width="26" opacity=".38"/>
  <path d="M76 115 C 268 25, 403 115, 556 51 S 844 12, 921 140" fill="none" stroke="#ffffff" stroke-width="13" opacity=".16"/>

  <g filter="url(#softShadow)" transform="translate(115 115) rotate(-3)">
    <rect width="518" height="332" rx="28" fill="#d1d1d1" opacity=".94"/>
    <rect x="38" y="38" width="192" height="89" rx="18" fill="#d1ae77" opacity=".86"/>
    <rect x="268" y="38" width="172" height="89" rx="18" fill="#ffffff" opacity=".15"/>
    <path d="M48 204 L153 153 L259 243 L403 121 L470 185" fill="none" stroke="#c69a55" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <g opacity=".32" stroke="#ffffff" stroke-width="8" stroke-linecap="round">
      <path d="M48 275 H422"/>
      <path d="M48 313 H326"/>
    </g>
  </g>
  <g transform="translate(643 140)" fill="#ffffff" opacity=".86">
    <rect width="172" height="243" rx="24"/>
    <circle cx="48" cy="57" r="20" fill="#c69a55"/>
    <path d="M48 128 H134 M48 172 H115" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity=".25"/>
  </g>

  <path d="M58 563 C230 499,365 614,538 538 S845 461,941 550" fill="none" stroke="#ffffff" stroke-width="6" opacity=".12"/>
</g>
</svg>
