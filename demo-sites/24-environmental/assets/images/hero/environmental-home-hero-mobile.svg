    <path d="M45 224 H126 M45 302 H108" stroke="#083d31" stroke-width="9" stroke-linecap="round" opacity=".25"/>
  </g>

  <path d="M54 986 C216 874,342 1075,504 941 S792 806,882 963" fill="none" stroke="#083d31" stroke-width="6" opacity=".12"/>
</g>
</svg>
