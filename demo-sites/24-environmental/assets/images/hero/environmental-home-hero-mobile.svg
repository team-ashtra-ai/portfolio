<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc">
<title id="title">Terra hero visual</title>
<desc id="desc">Environmental themed precision interface artwork with no visible text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fafdfb"/>
    <stop offset=".48" stop-color="#f4fbf7"/>
    <stop offset="1" stop-color="#cad9d3"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00a878"/>
    <stop offset="1" stop-color="#0e85ab"/>
  </linearGradient>
  <pattern id="grain" width="51" height="51" patternUnits="userSpaceOnUse">
    <path d="M0 25 H51" stroke="#083d31" stroke-width="1" opacity=".06"/>
    <path d="M25 0 V51" stroke="#083d31" stroke-width="1" opacity=".045"/>
  </pattern>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="24" stdDeviation="14" flood-color="#052820" flood-opacity=".22"/>
  </filter>
  <clipPath id="frame">
    <rect x="15" y="18" width="870" height="1083" rx="75"/>
  </clipPath>
</defs>
<rect width="900" height="1120" fill="url(#bg)"/>
<rect width="900" height="1120" fill="url(#grain)"/>
<g clip-path="url(#frame)">
  <path d="M-108 202 L522 -134 L1026 426 L288 1030 Z" fill="url(#accent)" opacity=".18"/>
  <path d="M648 -90 C486 224,756 470,549 806 C702 963,972 851,1062 493 L1062 -90 Z" fill="#ffffff" opacity=".36"/>

  <path d="M-38 851 C 162 582, 333 1030, 522 694 S 792 380, 980 604" fill="none" stroke="#00a878" stroke-width="25" opacity=".38"/>
  <path d="M72 201 C 252 44, 378 201, 522 89 S 792 22, 864 246" fill="none" stroke="#083d31" stroke-width="12" opacity=".16"/>

  <g filter="url(#softShadow)" transform="translate(108 201) rotate(-3)">
    <rect width="486" height="582" rx="28" fill="#073228" opacity=".94"/>
    <rect x="36" y="67" width="180" height="156" rx="18" fill="#33b993" opacity=".86"/>
    <rect x="252" y="67" width="162" height="156" rx="18" fill="#ffffff" opacity=".15"/>
    <path d="M45 358 L144 268 L243 425 L378 212 L441 324" fill="none" stroke="#00a878" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <g opacity=".32" stroke="#ffffff" stroke-width="8" stroke-linecap="round">
      <path d="M45 481 H396"/>
      <path d="M45 548 H306"/>
