<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
<title id="title">Clear hero visual</title>
<desc id="desc">Utilities themed public service artwork with no visible text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#958c9b"/>
    <stop offset=".48" stop-color="#140021"/>
    <stop offset="1" stop-color="#270b49"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff4fd8"/>
    <stop offset="1" stop-color="#9e80e7"/>
  </linearGradient>
  <pattern id="grain" width="49" height="49" patternUnits="userSpaceOnUse">
    <path d="M0 24 H49" stroke="#7f3cff" stroke-width="1" opacity=".06"/>
    <path d="M24 0 V49" stroke="#7f3cff" stroke-width="1" opacity=".045"/>
  </pattern>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#5327a6" flood-opacity=".22"/>
  </filter>
  <clipPath id="frame">
    <rect x="16" y="14" width="928" height="732" rx="63"/>
  </clipPath>
</defs>
<rect width="960" height="760" fill="url(#bg)"/>
<rect width="960" height="760" fill="url(#grain)"/>
<g clip-path="url(#frame)">
  <path d="M-115 137 L557 -91 L1094 289 L307 699 Z" fill="url(#accent)" opacity=".18"/>
  <path d="M691 -61 C518 152,806 319,586 547 C749 654,1037 578,1133 334 L1133 -61 Z" fill="#ffffff" opacity=".36"/>

  <path d="M-31 577 C 172 395, 355 699, 556 471 S 844 258, 1040 410" fill="none" stroke="#ff4fd8" stroke-width="26" opacity=".38"/>
  <path d="M76 136 C 268 30, 403 136, 556 60 S 844 15, 921 167" fill="none" stroke="#7f3cff" stroke-width="13" opacity=".16"/>

  <g filter="url(#softShadow)" transform="translate(115 136)">
    <rect width="614" height="364" rx="16" fill="#ffffff" opacity=".92"/>
    <rect x="57" y="60" width="153" height="167" rx="10" fill="#ff6fdf"/>
    <rect x="268" y="60" width="268" height="45" rx="8" fill="#7f3cff" opacity=".18"/>
    <rect x="268" y="144" width="211" height="45" rx="8" fill="#7f3cff" opacity=".13"/>
    <path d="M57 288 H537" stroke="#ff4fd8" stroke-width="10" stroke-linecap="round" opacity=".55"/>
  </g>

  <path d="M58 669 C230 593,365 730,538 638 S845 547,941 654" fill="none" stroke="#7f3cff" stroke-width="6" opacity=".12"/>
</g>
</svg>
