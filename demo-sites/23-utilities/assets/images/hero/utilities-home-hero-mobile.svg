<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc">
<title id="title">Clear hero visual</title>
<desc id="desc">Utilities themed public service artwork with no visible text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#958c9b"/>
    <stop offset=".48" stop-color="#140021"/>
    <stop offset="1" stop-color="#270b49"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff4fd8"/>
    <stop offset="1" stop-color="#9e80e7"/>
  </linearGradient>
  <pattern id="grain" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M0 22 H44" stroke="#7f3cff" stroke-width="1" opacity=".06"/>
    <path d="M22 0 V44" stroke="#7f3cff" stroke-width="1" opacity=".045"/>
  </pattern>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="24" stdDeviation="14" flood-color="#5327a6" flood-opacity=".22"/>
  </filter>
  <clipPath id="frame">
    <rect x="15" y="18" width="870" height="1083" rx="75"/>
  </clipPath>
</defs>
<rect width="900" height="1120" fill="url(#bg)"/>
<rect width="900" height="1120" fill="url(#grain)"/>
<g clip-path="url(#frame)">
  <path d="M-108 202 L522 -134 L1026 426 L288 1030 Z" fill="url(#accent)" opacity=".18"/>
  <path d="M648 -90 C486 224,756 470,549 806 C702 963,972 851,1062 493 L1062 -90 Z" fill="#ffffff" opacity=".36"/>

  <path d="M-24 851 C 162 582, 333 1030, 522 694 S 792 380, 980 604" fill="none" stroke="#ff4fd8" stroke-width="25" opacity=".38"/>
  <path d="M72 201 C 252 44, 378 201, 522 89 S 792 22, 864 246" fill="none" stroke="#7f3cff" stroke-width="12" opacity=".16"/>

  <g filter="url(#softShadow)" transform="translate(108 201)">
    <rect width="576" height="537" rx="16" fill="#ffffff" opacity=".92"/>
    <rect x="54" y="89" width="144" height="246" rx="10" fill="#ff6fdf"/>
    <rect x="252" y="89" width="252" height="67" rx="8" fill="#7f3cff" opacity=".18"/>
    <rect x="252" y="212" width="198" height="67" rx="8" fill="#7f3cff" opacity=".13"/>
    <path d="M54 425 H504" stroke="#ff4fd8" stroke-width="10" stroke-linecap="round" opacity=".55"/>
  </g>

  <path d="M54 986 C216 874,342 1075,504 941 S792 806,882 963" fill="none" stroke="#7f3cff" stroke-width="6" opacity=".12"/>
</g>
</svg>
