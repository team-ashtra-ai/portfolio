<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">Vow hero visual</title>
<desc id="desc">Events themed arrival atmosphere artwork with no visible text.</desc>
