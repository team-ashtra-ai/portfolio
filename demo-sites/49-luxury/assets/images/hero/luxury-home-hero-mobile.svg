  </filter>
  <clipPath id="frame">
    <rect x="15" y="18" width="870" height="1083" rx="75"/>
  </clipPath>
</defs>
<rect width="900" height="1120" fill="url(#bg)"/>
<rect width="900" height="1120" fill="url(#grain)"/>
<g clip-path="url(#frame)">
  <path d="M-108 202 L522 -134 L1026 426 L288 1030 Z" fill="url(#accent)" opacity=".18"/>
  <path d="M648 -90 C486 224,756 470,549 806 C702 963,972 851,1062 493 L1062 -90 Z" fill="#ffffff" opacity=".36"/>

  <path d="M-73 851 C 162 582, 333 1030, 522 694 S 792 380, 980 604" fill="none" stroke="#d4af37" stroke-width="25" opacity=".38"/>
  <path d="M72 201 C 252 44, 378 201, 522 89 S 792 22, 864 246" fill="none" stroke="#0b5f3a" stroke-width="12" opacity=".16"/>

  <g filter="url(#softShadow)" transform="translate(162 134)">
    <path d="M108 0 H432 C495 224 378 560 198 627 C54 504 18 179 108 0Z" fill="#ffffff" opacity=".86"/>
    <rect x="126" y="380" width="243" height="112" rx="28" fill="#111111" opacity=".82"/>
    <path d="M171 179 C252 67, 351 235, 405 112" stroke="#0b5f3a" stroke-width="8" fill="none" opacity=".24" stroke-linecap="round"/>
  </g>

