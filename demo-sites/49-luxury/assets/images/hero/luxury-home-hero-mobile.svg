<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc">
<title id="title">Maison hero visual</title>
<desc id="desc">Luxury themed private atelier artwork with no visible text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#909a97"/>
    <stop offset=".48" stop-color="#081f18"/>
    <stop offset="1" stop-color="#092b1e"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#d4af37"/>
    <stop offset="1" stop-color="#8a7329"/>
  </linearGradient>
  <pattern id="grain" width="39" height="39" patternUnits="userSpaceOnUse">
    <path d="M0 19 H39" stroke="#0b5f3a" stroke-width="1" opacity=".06"/>
    <path d="M19 0 V39" stroke="#0b5f3a" stroke-width="1" opacity=".045"/>
  </pattern>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
