<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">Maison hero visual</title>
<desc id="desc">Luxury themed private atelier artwork with no visible text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#909a97"/>
    <stop offset=".48" stop-color="#081f18"/>
    <stop offset="1" stop-color="#092b1e"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#d4af37"/>
    <stop offset="1" stop-color="#8a7329"/>
  </linearGradient>
  <pattern id="grain" width="47" height="47" patternUnits="userSpaceOnUse">
    <path d="M0 23 H47" stroke="#0b5f3a" stroke-width="1" opacity=".06"/>
