  <path d="M76 115 C 268 25, 403 115, 556 51 S 844 12, 921 140" fill="none" stroke="#0b5f3a" stroke-width="13" opacity=".16"/>

  <g filter="url(#softShadow)" transform="translate(172 76)">
    <path d="M115 0 H460 C528 128 403 320 211 358 C57 288 19 102 115 0Z" fill="#ffffff" opacity=".86"/>
    <rect x="134" y="217" width="259" height="64" rx="28" fill="#111111" opacity=".82"/>
    <path d="M182 102 C268 38, 374 134, 432 64" stroke="#0b5f3a" stroke-width="8" fill="none" opacity=".24" stroke-linecap="round"/>
