<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc">
<title id="title">Brand hero visual</title>
<desc id="desc">Personal Brands themed editorial gallery artwork with no visible text.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffefc"/>
    <stop offset=".48" stop-color="#fffdf8"/>
    <stop offset="1" stop-color="#d5d6d6"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c09a4a"/>
    <stop offset="1" stop-color="#8f8a57"/>
  </linearGradient>
  <pattern id="grain" width="46" height="46" patternUnits="userSpaceOnUse">
    <path d="M0 23 H46" stroke="#17233c" stroke-width="1" opacity=".06"/>
    <path d="M23 0 V46" stroke="#17233c" stroke-width="1" opacity=".045"/>
  </pattern>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="24" stdDeviation="14" flood-color="#0f1727" flood-opacity=".22"/>
  </filter>
  <clipPath id="frame">
    <rect x="15" y="18" width="870" height="1083" rx="75"/>
  </clipPath>
</defs>
<rect width="900" height="1120" fill="url(#bg)"/>
<rect width="900" height="1120" fill="url(#grain)"/>
<g clip-path="url(#frame)">
  <path d="M-108 202 L522 -134 L1026 426 L288 1030 Z" fill="url(#accent)" opacity=".18"/>
  <path d="M648 -90 C486 224,756 470,549 806 C702 963,972 851,1062 493 L1062 -90 Z" fill="#ffffff" opacity=".36"/>

  <path d="M-24 851 C 162 582, 333 1030, 522 694 S 792 380, 980 604" fill="none" stroke="#c09a4a" stroke-width="25" opacity=".38"/>
  <path d="M72 201 C 252 44, 378 201, 522 89 S 792 22, 864 246" fill="none" stroke="#17233c" stroke-width="12" opacity=".16"/>

  <g filter="url(#softShadow)" transform="translate(90 145) rotate(-2)">
    <rect width="270" height="582" rx="12" fill="#ffffff" opacity=".92"/>
    <rect x="36" y="56" width="198" height="246" rx="8" fill="#cbac6b"/>
    <rect x="36" y="347" width="198" height="156" rx="8" fill="#bec1c8"/>
  </g>
  <g filter="url(#softShadow)" transform="translate(405 224) rotate(4)">
    <rect width="342" height="470" rx="16" fill="#ffffff" opacity=".88"/>
    <path d="M36 336 C 108 168, 216 425, 306 201" fill="none" stroke="#c09a4a" stroke-width="12" stroke-linecap="round"/>
  </g>

  <path d="M54 986 C216 874,342 1075,504 941 S792 806,882 963" fill="none" stroke="#17233c" stroke-width="6" opacity=".12"/>
</g>
</svg>
